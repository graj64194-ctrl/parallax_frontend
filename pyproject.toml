[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "parallex"
version = "0.1.0"
description = "Multi-Modal, Sun-Angle & Scale-Invariant Image Correspondence for Chandrayaan-2"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["remote-sensing", "image-registration", "chandrayaan-2", "lunar", "multimodal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "scipy>=1.13",
    "Pillow>=10.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "aiofiles>=23.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]
learned = [
    "torch>=2.3",
    "torchvision>=0.18",
    "kornia>=0.7",
    "lightglue>=0.1",
]

[project.scripts]
parallex-api   = "parallex.api.app:main"
parallex-run   = "scripts.run_parallax:main"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# pytest (migrated from pytest.ini)
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths   = ["tests"]
python_files  = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts     = "-q --tb=short"
asyncio_mode = "auto"

# ---------------------------------------------------------------------------
# ruff linter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
ignore_missing_imports = true
strict = false
