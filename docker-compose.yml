version: "3.9"

services:
  # -----------------------------------------------------------------------
  # Python / FastAPI backend
  # -----------------------------------------------------------------------
  parallex-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: parallex-backend:latest
    container_name: parallex-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=info
    volumes:
      # Mount your Chandrayaan-2 PDS4 data directory here.
      # Do NOT bake large mission datasets into the image.
      - ./data:/app/data:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # -----------------------------------------------------------------------
  # React / Vite frontend (development)
  # Swap with a static file server (nginx) for production.
  # -----------------------------------------------------------------------
  parallex-frontend:
    image: node:20-alpine
    container_name: parallex-frontend
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      - .:/app:rw
      - /app/node_modules        # anonymous volume keeps host node_modules out
    depends_on:
      - parallex-backend

volumes:
  # Declared top-level so Docker tracks them across restarts
  {}
